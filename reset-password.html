<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset Password - Essence</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>Reset your password</h1>
    <form id="request-reset-form">
      <label for="reset-email">Account email</label>
      <input id="reset-email" type="email" autocomplete="email" required maxlength="254" />
      <button class="btn" type="submit">Send reset link</button>
    </form>
    <form id="new-password-form" hidden>
      <label for="new-password">New password (at least 12 characters)</label>
      <input id="new-password" type="password" autocomplete="new-password" required minlength="12" maxlength="72" />
      <button class="btn" type="submit">Set new password</button>
    </form>
    <p id="reset-message" role="status" aria-live="polite"></p>
    <a href="index.html">Back to Essence</a>
  </main>
  <script src="reset-password.js"></script>
</body>
</html>
