<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin - Subscribers</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="container admin-container">
    <h1>Admin — Subscribers</h1>

    <div class="admin-login">
      <input id="admin-password" type="password" placeholder="Admin password" />
      <button id="admin-login-btn" class="btn">Login</button>
      <button id="admin-logout-btn" class="btn hidden">Logout</button>
      <button id="export-subs-btn" class="btn hidden">Export CSV</button>
      <div id="login-message" style="margin-top: 8px; color: var(--muted)"></div>
    </div>

    <section id="subscribers-section" class="hidden">
      <h2>Subscribers</h2>
      <div id="subscribers-list">Loading...</div>
    </section>
  </main>

  <script src="admin-subscribers.js"></script>
</body>

</html>
